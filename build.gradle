plugins {
    id 'io.nextflow.nextflow-plugin' version '1.0.0-beta.10'
}

version = '1.1.3'

nextflowPlugin {
    nextflowVersion = '25.10.0'

    provider = 'Cancer Research UK Cambridge Institute'
    className = 'org.cruk.nextflow.plugin.crukci.logscan.LogScanPlugin'
    extensionPoints = [
        'org.cruk.nextflow.plugin.crukci.extension.CRUKCIExtension',
        'org.cruk.nextflow.plugin.crukci.logscan.LogScanObserverFactory',
        'org.cruk.nextflow.plugin.crukci.CRUKCIConfig'
    ]
}

repositories {
    mavenCentral()
}

// The extensionPoints task writes to build/resources/main, which is on the test
// compile classpath. Gradle 8 strict task ordering requires an explicit dependency.
tasks.named('compileTestJava') {
    dependsOn tasks.named('extensionPoints')
}
tasks.named('compileTestGroovy') {
    dependsOn tasks.named('extensionPoints')
}

configurations {
    mockitoAgent
}

dependencies {
    implementation 'org.apache.commons:commons-lang3:3.19.0'
    compileOnly 'io.nextflow:nextflow:25.10.0'
    compileOnly 'io.nextflow:nf-commons:25.10.0'
    testImplementation 'io.nextflow:nextflow:25.10.0'
    testImplementation 'io.nextflow:nf-commons:25.10.0'
    testImplementation 'org.apache.groovy:groovy-all:4.0.29'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.1'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.20.0'
    // Force junit-platform-launcher to match junit-platform-engine (1.14.1).
    // Nextflow's transitive groovy-test-junit5 dependency pins launcher to 1.13.3,
    // which is misaligned with the engine version and causes test discovery to fail.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.1'
    // Mockito agent configuration - prevents dynamic agent loading warnings in JDK 21+
    mockitoAgent('org.mockito:mockito-core:5.20.0') { transitive = false }
}

tasks.named('test') {
    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
}
